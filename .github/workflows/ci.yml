name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The wrapper was committed from Windows; make sure it is executable on Linux.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Gradle dependency + wrapper caching (no custom cache keys).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 'build' compiles, runs the full test suite (Testcontainers integration
      # tests run here because GitHub Linux runners provide Docker) and
      # assembles the boot jar — one command, no redundant test execution.
      # The tests are self-contained (@ServiceConnection + test jwt.secret
      # property), so no secrets or environment variables are needed here.
      - name: Build and test
        run: ./gradlew build

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc strict typecheck + Vite production build (the existing script).
      # The native Tauri bundle is intentionally not built in this first CI.
      - name: Production build
        run: npm run build
