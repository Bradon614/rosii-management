spring:
  application:
    name: rosii-management

  datasource:
    # All values come from environment variables (.env.example at the repo root).
    # Defaults only point at a local PostgreSQL used during development.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rosii_management}
    username: ${DATABASE_USERNAME:rosii}
    password: ${DATABASE_PASSWORD:}

  flyway:
    # Migrations run on startup and require a reachable PostgreSQL.
    # Set FLYWAY_ENABLED=false to boot the API without a database (frontend-only dev work).
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  jpa:
    hibernate:
      # The schema is owned by Flyway migrations; Hibernate never creates or drops it.
      ddl-auto: none
      # Java camelCase -> SQL snake_case (see docs/database-conventions.md).
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    # Explicit dialect so the application can also start without a live database
    # (with FLYWAY_ENABLED=false); Hibernate otherwise connects once at startup
    # to detect the dialect.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

jwt:
  # Signing key: must be provided via environment (>= 32 bytes). Never hardcoded.
  secret: ${JWT_SECRET:}
  # Access-token lifetime. Plain numbers are seconds; Duration style also works (e.g. 30m).
  expiration: ${JWT_EXPIRATION:3600}
